name: retail-supply-chain-integration-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: rscp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - integration_net

  adminer:
    image: adminer:latest
    container_name: rscp_adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net

  mock-api:
    build:
      context: ./app/mock_enterprise_api
    container_name: rscp_mock_api
    ports:
      - "${FASTAPI_PORT}:8000"
    volumes:
      - ./app/mock_enterprise_api:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net

  nifi:
    image: apache/nifi:2.10.0
    container_name: rscp_nifi
    profiles:
      - middleware
    ports:
      - "${NIFI_PORT}:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_PROXY_HOST: localhost:${NIFI_PORT}
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - ./data:/opt/nifi/nifi-current/data
      - ./nifi/drivers:/opt/nifi/nifi-current/drivers
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    container_name: rscp_redpanda
    profiles:
      - eventing
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    networks:
      - integration_net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.1.0
    container_name: rscp_redpanda_console
    profiles:
      - eventing
    ports:
      - "${REDPANDA_CONSOLE_PORT}:8080"
    environment:
      CONFIG_FILEPATH: /tmp/redpanda-console-config.yml
    volumes:
      - ./redpanda/console-config.yml:/tmp/redpanda-console-config.yml:ro
    depends_on:
      - redpanda
    networks:
      - integration_net

volumes:
  postgres_data:
  nifi_state:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:

networks:
  integration_net:
    driver: bridge